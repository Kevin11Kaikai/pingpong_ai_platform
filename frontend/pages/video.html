<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频分析 - 乒乓 AI</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
</head>
<body>
  <div class="app-layout">
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1 class="page-title">视频分析</h1>
          <p class="page-subtitle">上传乒乓球视频，AI 自动分析球体轨迹</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" onclick="VideoPage.showHistory()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            分析历史
          </button>
        </div>
      </header>

      <div class="page-content">
        <!-- 上传区域 -->
        <div class="card mb-lg" id="uploadSection">
          <div class="card-body">
            <div class="upload-area" id="uploadArea" ondrop="VideoPage.handleDrop(event)" ondragover="VideoPage.handleDragOver(event)" ondragleave="VideoPage.handleDragLeave(event)">
              <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="VideoPage.handleFileSelect(event)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <div class="upload-area-title">拖拽视频文件到此处，或点击上传</div>
              <div class="upload-area-desc">支持 MP4、MOV、AVI 格式，最大 500MB</div>
              <button class="btn btn-primary mt-md" onclick="document.getElementById('videoInput').click()">选择文件</button>
            </div>

            <!-- 上传进度 -->
            <div id="uploadProgress" style="display: none; margin-top: 20px;">
              <div class="progress-labeled">
                <span class="text-sm">上传中</span>
                <div class="progress">
                  <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 视频播放器和分析结果 -->
        <div class="video-layout" id="analysisSection" style="display: none;">
          <!-- 视频播放器 -->
          <div class="card">
            <div class="video-player-container">
              <video id="videoPlayer" class="video-player" controls></video>
              <canvas id="overlayCanvas" class="video-overlay-canvas"></canvas>
            </div>
            <div class="card-body">
              <div class="flex items-center justify-between mb-md">
                <div>
                  <h3 class="card-title" id="videoName">视频名称</h3>
                  <p class="text-sm text-secondary" id="videoDuration"></p>
                </div>
                <div class="flex gap-sm">
                  <button class="btn btn-secondary btn-sm" onclick="VideoPage.toggleTrajectory()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                      <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    轨迹叠加
                  </button>
                  <button class="btn btn-secondary btn-sm" onclick="VideoPage.downloadVisualization()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                      <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    下载可视化
                  </button>
                </div>
              </div>
              <div class="trajectory-legend">
                <div class="legend-item">
                  <div class="legend-color" style="background-color: #1890ff;"></div>
                  <span>球体轨迹</span>
                </div>
                <div class="legend-item">
                  <div class="legend-color" style="background-color: #ff4d4f;"></div>
                  <span>当前位置</span>
                </div>
                <div class="legend-item">
                  <div class="legend-color" style="background-color: #52c41a;"></div>
                  <span>左侧落点</span>
                </div>
                <div class="legend-item">
                  <div class="legend-color" style="background-color: #faad14;"></div>
                  <span>右侧落点</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 分析面板 -->
          <div class="video-analysis-panel">
            <!-- 任务状态 -->
            <div class="card" id="taskStatusCard">
              <div class="card-header">
                <h3 class="card-title">分析状态</h3>
                <span class="badge badge-primary" id="taskStatusBadge">处理中</span>
              </div>
              <div class="card-body">
                <div class="progress-labeled mb-md">
                  <div class="progress">
                    <div class="progress-bar" id="taskProgress" style="width: 0%;"></div>
                  </div>
                  <span class="progress-text" id="taskProgressText">0%</span>
                </div>
                <div class="text-sm text-secondary" id="taskMessage">正在上传视频...</div>
              </div>
            </div>

            <!-- 分析统计 -->
            <div class="card" id="statsCard" style="display: none;">
              <div class="card-header">
                <h3 class="card-title">分析统计</h3>
              </div>
              <div class="card-body">
                <div class="analysis-stats" id="analysisStats">
                  <!-- 由 JS 填充 -->
                </div>
              </div>
            </div>

            <!-- 详细数据 -->
            <div class="card" id="detailsCard" style="display: none;">
              <div class="card-header">
                <h3 class="card-title">详细数据</h3>
              </div>
              <div class="card-body">
                <div class="tabs">
                  <div class="tab-item active" data-tab="speed" onclick="VideoPage.switchTab('speed')">球速分析</div>
                  <div class="tab-item" data-tab="landing" onclick="VideoPage.switchTab('landing')">落点分布</div>
                  <div class="tab-item" data-tab="rally" onclick="VideoPage.switchTab('rally')">回合统计</div>
                </div>
                <div class="tab-content">
                  <div class="tab-pane active" id="speedTab">
                    <div id="speedData"></div>
                  </div>
                  <div class="tab-pane" id="landingTab">
                    <div id="landingData"></div>
                  </div>
                  <div class="tab-pane" id="rallyTab">
                    <div id="rallyData"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts (v3: cache-bust after canvas/video.js rewrites) -->
  <script src="/static/js/api/client.js?v=3"></script>
  <script src="/static/js/api/ball-tracking.js?v=3"></script>
  <script src="/static/js/utils/format.js?v=3"></script>
  <script src="/static/js/utils/storage.js?v=3"></script>
  <script src="/static/js/utils/canvas.js?v=3"></script>
  <script src="/static/js/components/nav.js?v=3"></script>
  <script src="/static/js/components/toast.js?v=3"></script>
  <script src="/static/js/components/modal.js?v=3"></script>
  <script src="/static/js/components/loading.js?v=3"></script>
  <script src="/static/js/pages/video.js?v=3"></script>
  <script src="/static/js/main.js?v=3"></script>
</body>
</html>
