# =============================================================================
# Prometheus Configuration - Pingpong AI Platform
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "pingpong-monitor"

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files (optional)
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 15s

  # Pingpong API metrics
  - job_name: "pingpong-api"
    static_configs:
      - targets: ["pingpong-api:8000"]
    scrape_interval: 10s
    metrics_path: /metrics
    scheme: http
