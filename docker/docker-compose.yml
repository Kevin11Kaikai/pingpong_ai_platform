version: "3.8"

services:
  pingpong-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pingpong-api
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
      - ../config:/app/config
      - ../data:/app/data
      - ../logs:/app/logs
    env_file:
      - ../.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
